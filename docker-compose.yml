name: sprintforge-platform

services:
  # --------------------------------------------------------------------------
  # Primary Database: PostgreSQL 16
  # Profiles: core
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sprintforge-postgres
    profiles: ["core"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-SprintForge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      sprintforge-network:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-SprintForge}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # Cache & In-Memory Store: Redis 7
  # Profiles: infra
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sprintforge-redis
    profiles: ["infra"]
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_secure_password_123}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      sprintforge-network:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password_123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # SprintForge Core Application Engine
  # Profiles: core
  # --------------------------------------------------------------------------
  sprintforge-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sprintforge/backend:latest
    container_name: sprintforge-backend
    profiles: ["core"]
    restart: unless-stopped
    env_file:
      - docker.env
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      sprintforge-network:
        aliases:
          - sprintforge-backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # Reverse Proxy & Edge Web Server: Nginx
  # Profiles: infra
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: sprintforge-nginx
    profiles: ["infra"]
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      sprintforge-backend:
        condition: service_healthy
    networks:
      sprintforge-network:
        aliases:
          - nginx
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # Metrics Collector: Prometheus
  # Profiles: monitoring
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: sprintforge-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      sprintforge-network:
        aliases:
          - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Metrics Visualization Dashboard: Grafana
  # Profiles: monitoring
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: sprintforge-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_secure_password_123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      sprintforge-network:
        aliases:
          - grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  sprintforge-network:
    name: sprintforge-network
    driver: bridge

volumes:
  postgres_data:
    name: sprintforge_postgres_data
  redis_data:
    name: sprintforge_redis_data
  uploads_data:
    name: sprintforge_uploads_data
  logs_data:
    name: sprintforge_logs_data
  prometheus_data:
    name: sprintforge_prometheus_data
  grafana_data:
    name: sprintforge_grafana_data
