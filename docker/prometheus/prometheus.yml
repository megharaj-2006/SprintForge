global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'sprintforge-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['sprintforge-backend:8080']
        labels:
          application: 'SprintForge Platform'
          environment: 'production-local'
