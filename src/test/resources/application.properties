spring.application.name=springbootproject-test
spring.main.allow-bean-definition-overriding=true

# Test Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Security / JWT Configuration for Tests
jwt.secret=${JWT_SECRET:9a6747fc6259aa374ab4e1bb2a0918d653777c5760848033282b8a74e622b7c6}
jwt.expiration=86400000

# JPA / Hibernate Configurations for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
