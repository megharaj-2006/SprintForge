spring.application.name=springbootproject
spring.profiles.active=local
spring.main.allow-bean-definition-overriding=true
server.port=${SERVER_PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/SprintForge}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Security / JWT Configuration
jwt.secret=${JWT_SECRET:9a6747fc6259aa374ab4e1bb2a0918d653777c5760848033282b8a74e622b7c6}
jwt.expiration=${JWT_EXPIRATION:86400000}

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema baseline
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.encoding=UTF-8
