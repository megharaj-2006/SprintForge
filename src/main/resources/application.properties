spring.application.name=springbootproject
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.main.allow-bean-definition-overriding=true
server.port=${SERVER_PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/SprintForge}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Security / JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
sprintforge.security.jwt.secret-key=${JWT_SECRET}
sprintforge.security.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema baseline
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.encoding=UTF-8