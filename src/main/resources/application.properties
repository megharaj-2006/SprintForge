spring.application.name=springbootproject
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.main.allow-bean-definition-overriding=true
server.port=${PORT:${SERVER_PORT:8080}}

# Database Configuration
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/SprintForge}}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Security / JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
sprintforge.security.jwt.secret-key=${JWT_SECRET}
sprintforge.security.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.encoding=UTF-8

# OAuth2 Provider Configuration
sprintforge.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
sprintforge.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}

sprintforge.oauth.github.client-id=${GITHUB_CLIENT_ID:}
sprintforge.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}

sprintforge.oauth.linkedin.client-id=${LINKEDIN_CLIENT_ID:}
sprintforge.oauth.linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:}

sprintforge.oauth.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
sprintforge.oauth.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
sprintforge.oauth.microsoft.tenant-id=${MICROSOFT_TENANT_ID:common}

# Mail Configuration (Gmail SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
sprintforge.mail.from=${SPRING_MAIL_FROM:${spring.mail.username:no-reply@sprintforge.dev}}